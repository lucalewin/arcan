[package]
name = "arcan"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
base64 = "0.22.1"
bytes = "1.11.1"
dotenvy = "0.15.7"
jsonwebtoken = {version = "10.4.0", features = ["aws_lc_rs"] }
opaque-ke = "4.0.1"
redis = { version = "1.2.1", features = ["aio", "tokio-comp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shared = { version = "0.1.0", path = "../shared" }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "time", "uuid"] }
time = { version = "0.3.47", features = ["serde"] }
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
